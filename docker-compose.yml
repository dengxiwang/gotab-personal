services:
  gotab-server:
    image: doxwant/gotab:latest
    container_name: gotab-server
    ports:
      - "8080:8080" # 映射主机的 8080 端口到容器的 8080 端口

    volumes:
      # 包含 config.toml、uploads、sourceStore 和 SQLite 数据库。
      - ./data:/app/data

    environment:
      - SERVER_PORT=8080 # 设置服务监听的端口为 8080

    restart: always # 容器退出时自动重启
